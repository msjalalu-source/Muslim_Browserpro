name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer, but found $JAVA_MAJOR."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages and accept licenses
        run: |
          SDKMANAGER_BIN=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER_BIN" --licenses || true
          "$SDKMANAGER_BIN" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          yes | "$SDKMANAGER_BIN" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up environment and keystore
        run: |
          # Ensure .env exists to satisfy secrets-gradle-plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Ensure debug.keystore exists in rootDir as configured in app/build.gradle.kts
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

          # Ensure gradlew has executable permissions and test wrapper
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK."
            echo "Discovered APK files under app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is an empty file."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: $EXPECTED_APK does not have a .apk extension."
            exit 1
          fi
          echo "Confirmed valid APK at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR="${{ runner.temp }}/apk_release_asset"
          mkdir -p "$TEMP_ASSET_DIR"
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_NAME at $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Release asset does not have a .apk extension."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "### Debug APK Build Information
          - **Build**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: ${{ github.sha }}
          - **Purpose**: Intended for testing and development
          - **Type**: Not a Play Store production release
          - **Signing**: Signed with a temporary debug keystore" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "GitHub Release creation succeeded."
            gh release view "$RELEASE_TAG" --json tagName,name,url,assets
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            echo "Release URL: $RELEASE_URL"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Asset Filename: ${{ steps.prepare_asset.outputs.asset_name }}"

            {
              echo "### 🚀 Debug APK Released Successfully"
              echo ""
              echo "**Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo ""
              echo "- **Tag:** \`$RELEASE_TAG\`"
              echo "- **Asset File:** \`${{ steps.prepare_asset.outputs.asset_name }}\`"
              echo ""
              echo "📱 You can download the APK directly onto your phone from the **Assets** section of the release above."
              echo ""
              echo "📦 The GitHub Actions build artifact **\`app-debug-apk\`** is also available as a backup under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not complete or was skipped."
            echo "APK build succeeded and the debug APK was preserved as a GitHub Actions artifact."
            echo "Artifact name: app-debug-apk"

            {
              echo "### ⚠️ Release Publishing Notice"
              echo ""
              echo "The debug APK was built successfully and uploaded as a GitHub Actions artifact."
              echo "Automatic GitHub Release creation did not complete."
              echo ""
              echo "📦 **Backup Download Available:**"
              echo "You can download the APK artifact named **\`app-debug-apk\`** directly from the **Artifacts** section at the bottom of this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
