name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages and accept licenses
        run: |
          SDKMANAGER_BIN=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER_BIN" --licenses || true
          "$SDKMANAGER_BIN" "platforms;android-36" "build-tools;36.0.0" || true
          yes | "$SDKMANAGER_BIN" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found, generating wrapper..."
            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              GRADLE_VER=$(grep -E 'distributionUrl=.*gradle-[0-9.]+' gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/' | head -n 1)
              if [ -n "$GRADLE_VER" ]; then
                echo "Generating wrapper matching gradle-wrapper.properties version: $GRADLE_VER"
                gradle wrapper --gradle-version "$GRADLE_VER"
              else
                gradle wrapper
              fi
            else
              gradle wrapper
            fi
          fi
          chmod +x gradlew

      - name: Configure release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -f .env ] || touch .env
          chmod +x gradlew
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required release signing secrets are missing! Please configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          if [ ! -s "$GITHUB_WORKSPACE/release.keystore" ]; then
            echo "::error::Failed to decode release.keystore from KEYSTORE_BASE64 or file is empty!"
            exit 1
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Verify APK signature
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK $APK_PATH not found! Built APK was either unsigned or failed to generate."
            exit 1
          fi
          APKSIGNER_BIN=$(command -v apksigner || find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="${{ steps.verify_apk.outputs.apk_path }}"
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_NAME="${REPO_NAME}-release-build-${{ github.run_number }}.apk"
          cp "$APK_PATH" "$ASSET_NAME"

          RELEASE_TAG="release-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Release APK Build #${{ github.run_number }}"

          gh release create "$RELEASE_TAG" "$ASSET_NAME" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "### Release APK Build Information
          - **Build Variant**: Release
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: ${{ github.sha }}" \
            --latest

          RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "")
          if [ -n "$RELEASE_URL" ]; then
            {
              echo "### 🚀 Release APK Published Successfully"
              echo ""
              echo "**Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo ""
              echo "- **Tag:** \`$RELEASE_TAG\`"
              echo "- **Asset:** \`$ASSET_NAME\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
